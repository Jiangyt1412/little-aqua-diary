<!doctype html>
<!-- # 参考用户给出的三屏编排；只使用本项目真实界面，不复制其他产品内容。 -->
<html lang="zh-CN"><meta charset="utf-8"><title>小小水族日记 · 静态功能总览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ed;color:#293f32;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}#stage{position:relative;width:2400px;height:1760px;overflow:hidden;isolation:isolate}#stage:before{content:'';position:absolute;inset:0;z-index:-1;opacity:.38;background:var(--garden) center bottom/cover no-repeat}.heading{position:absolute;left:128px;right:128px;top:86px}.meta{display:flex;align-items:center;justify-content:space-between;color:#798673;font-size:25px;letter-spacing:1px}.heading h1{margin:27px 0 0;font-family:'Songti SC','STSong',serif;font-size:88px;font-weight:600;line-height:1.25;letter-spacing:-1px}.columns{position:absolute;left:128px;right:128px;top:326px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:72px}.column{margin:0;min-width:0;text-align:center}.shot{display:block;width:476px;height:auto;margin:0 auto;border-radius:25px;outline:2px solid #cfd7c9;box-shadow:0 23px 47px -27px #263e3438}.caption{margin-top:35px}.caption h2{margin:0;display:flex;align-items:baseline;justify-content:center;gap:17px;font-size:45px;font-weight:600;line-height:1.45;letter-spacing:-.4px}.caption h2 span{font-family:Georgia,serif;font-size:27px;font-weight:400;color:#84917b;letter-spacing:1px}.caption p{font-size:28px;line-height:1.65;color:#7a8777;margin:13px 0 0}.foot{position:absolute;left:128px;right:128px;bottom:45px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #dce2d5;padding-top:25px;font-size:23px;color:#85907d;letter-spacing:.4px}
</style>
<main id="stage"><header class="heading"><div class="meta"><span>小小水族日记 / 功能一览</span><span data-version></span></div><h1></h1></header><div class="columns"></div><footer class="foot"><span>每一缸，都有自己的日常。</span><span>真实 App 界面 · 演示数据</span></footer></main>
<script type="module">
// # 说明文字与网页/README共用内容源，截图只做原比例排版。
const query=new URLSearchParams(location.search),base=query.get('assets')||'../../dist/',version=query.get('version')||'1.8.0';
window.ready=(async()=>{const data=await(await fetch('./showcase-data.json')).json();document.querySelector('h1').textContent=data.title;document.querySelector('[data-version]').textContent=`v${version} / 实际 App 界面`;document.querySelector('#stage').style.setProperty('--garden',`url("${base}assets/presentation/water-garden.svg")`);for(const item of data.cards){const figure=document.createElement('figure');figure.className='column';const img=document.createElement('img');img.className='shot';img.src=`${base}media/${item.shot}-v${version}.jpg`;img.alt=item.alt;const caption=document.createElement('figcaption');caption.className='caption';const h=document.createElement('h2'),n=document.createElement('span'),title=document.createElement('strong');n.textContent=item.number;title.textContent=item.title;h.append(n,title);const p=document.createElement('p');item.lines.forEach((text,index)=>{if(index)p.append(document.createElement('br'));p.append(document.createTextNode(text));});caption.append(h,p);figure.append(img,caption);document.querySelector('.columns').append(figure);}await Promise.all([...document.images].map(img=>img.decode()));await document.fonts.ready;})();
</script></html>
