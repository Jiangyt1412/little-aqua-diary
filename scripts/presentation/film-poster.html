<!doctype html>
<!-- # 静态视频入口从已确认MP4取真实帧，播放标记只用于说明链接用途。 -->
<html lang="zh-CN"><meta charset="utf-8"><title>完整产品短片 · 24 秒</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ed;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#264a3b}#stage{position:relative;width:1920px;height:1080px;overflow:hidden}video{width:100%;height:100%;display:block;object-fit:contain}.play-label{position:absolute;left:130px;bottom:144px;display:flex;align-items:center;gap:22px;padding:18px 32px 18px 20px;border:1px solid #d8e1d3;border-radius:72px;background:#fffffff2;box-shadow:0 12px 40px #193e2b16;font-size:32px;letter-spacing:1px}.play-mark{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:#286a53}.play-mark svg{width:26px;height:26px;fill:white;margin-left:4px}
</style>
<main id="stage"><video muted playsinline preload="auto" aria-label="已确认产品短片真实帧"></video><div class="play-label"><span class="play-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v18l16-9z"/></svg></span><span>完整短片 · 24 秒</span></div></main>
<script type="module">
// # 仅在浏览器制作时定位一帧；导出的PNG不自动播放或循环。
const query=new URLSearchParams(location.search),base=query.get('assets')||'../../dist/',version=query.get('version')||'1.7.0',v=document.querySelector('video');
window.ready=(async()=>{v.src=`${base}media/demo-v${version}.mp4`;await new Promise((resolve,reject)=>{v.addEventListener('loadedmetadata',resolve,{once:true});v.addEventListener('error',reject,{once:true});});await new Promise(resolve=>{v.addEventListener('seeked',()=>requestAnimationFrame(()=>requestAnimationFrame(resolve)),{once:true});v.currentTime=1.4;});await document.fonts.ready;})();
</script></html>
