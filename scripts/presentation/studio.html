<!doctype html>
<!-- # 同一条真实 UI 录像贯穿全片，镜头在柔和水域背景中连续移动。 -->
<html lang="zh-CN"><meta charset="utf-8"><title>水族日记 · 连续产品镜头</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafaf6;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#253f34}#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#fafaf6}.brand{position:absolute;left:112px;top:60px;display:flex;align-items:center;gap:14px;font-size:23px;letter-spacing:.6px;font-weight:600;z-index:20}.brand img{width:43px;height:43px;border-radius:11px}.version{position:absolute;right:110px;top:72px;font-size:16px;color:#84917e;letter-spacing:1px;z-index:20}.copy{position:absolute;left:140px;top:350px;width:850px;z-index:10;opacity:0;transform-origin:left center}h1,h2,p{margin:0}h1,h2{font-size:94px;font-weight:630;letter-spacing:-2.8px;line-height:1.28}.copy p{font-size:25px;color:#7c8b79;letter-spacing:.5px;margin-top:28px}.copy[data-id=hero]{top:345px}.copy[data-id=hero] h1{font-size:105px}.copy[data-id=records]{top:250px}.copy[data-id=records] h2{font-size:80px}.ui-window{position:absolute;left:1060px;top:90px;width:440px;overflow:hidden;border-radius:15px;outline:1px solid #e0e5d8;box-shadow:0 24px 45px -28px #27433333;transform-origin:top left;background:#fffef8;will-change:transform}.ui-window>img,.ui-window>video{display:block;position:absolute;top:0;left:0;width:100%;height:auto;max-width:none}.ui-window video{opacity:0}.secondary-ui{position:absolute;left:1540px;top:250px;width:350px;border-radius:13px;overflow:hidden;outline:1px solid #e0e5d8;box-shadow:0 20px 40px -26px #27433333}.secondary-ui img{width:100%;display:block}.timeline-window{position:absolute;left:140px;top:535px;width:1000px;max-height:460px;overflow:hidden;border:1px solid #e1e7db;border-radius:13px;opacity:0;background:#fffdf5;transform-origin:center}.timeline-window img{display:block;width:100%;height:auto}.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;z-index:15;pointer-events:none}.end img{width:86px;height:86px;border-radius:20px;margin-bottom:27px}.end h2{font-size:76px;letter-spacing:-1.5px}.end p{color:#7c8b79;font-size:21px;margin-top:30px;letter-spacing:.4px}.footnote{position:absolute;left:112px;bottom:34px;font-size:15px;color:#879481;letter-spacing:.5px;z-index:20}.chapter{position:absolute;left:140px;top:285px;font-size:18px;letter-spacing:3px;color:#84917e;opacity:0}.progress{position:absolute;left:112px;right:112px;bottom:17px;height:1px;background:#e4e9df}.progress i{display:block;height:1px;width:0;background:#9caf94}
</style>
<div id="stage">
 <div class="brand"><img data-icon alt="">小小水族日记</div><div class="version">v1.6.10</div>
 <div class="chapter"></div>
 <div class="copy" data-id="hero"><h1>照顾好，<br>也记录好。</h1><p>给每一缸，留一点日常。</p></div>
 <div class="copy" data-id="care"><h2>随手记下。</h2></div>
 <div class="copy" data-id="residents"><h2>每一位，<br>都有名字。</h2></div>
 <div class="copy" data-id="records"><h2>日常，<br>看得见。</h2></div>
 <div class="copy" data-id="reminders"><h2>需要时，<br>停几天。</h2></div>
 <div class="ui-window"><img data-current-shot alt="真实 App 演示界面"><video muted playsinline></video></div>
 <div class="secondary-ui"><img data-shot="phone-residents" alt="真实居民界面"></div>
 <div class="timeline-window"><img data-shot="timeline-detail" alt="真实共享时间轴"></div>
 <div class="end"><img data-icon alt=""><h2>照顾好，也记录好。</h2><p>jiangyt1412.github.io/little-aqua-diary</p></div>
 <div class="footnote">真实 App 界面 · 演示资料</div><div class="progress"><i></i></div>
</div>
<script type="module">
// # 原生页面帧保持真实内容；相机位置使用连续插值，取消分章节背景切换。
const qs=new URLSearchParams(location.search),base=qs.get('assets')||'../../dist/',media=base+'media/',shot=document.querySelector('[data-current-shot]'),video=document.querySelector('video'),ui=document.querySelector('.ui-window'),secondary=document.querySelector('.secondary-ui'),timeline=document.querySelector('.timeline-window'),end=document.querySelector('.end'),chapter=document.querySelector('.chapter'),copy=[...document.querySelectorAll('.copy')];
for(const img of document.querySelectorAll('[data-icon]'))img.src=base+'icon-192.png';for(const img of document.querySelectorAll('[data-shot]'))img.src=media+img.dataset.shot+'-v1.6.10.jpg';
const fallback=new Map();for(const name of['phone-home','phone-residents','phone-history','phone-pause']){const img=new Image();img.src=media+name+'-v1.6.10.jpg';fallback.set(name,img);}shot.src=fallback.get('phone-home').src;
const clamp=x=>Math.min(1,Math.max(0,x)),smooth=x=>{x=clamp(x);return x*x*x*(x*(x*6-15)+10)},mix=(a,b,t)=>a+(b-a)*t;
const poses=[[0,1060,85,440],[2,1050,65,460],[4.2,1040,-100,610],[6.2,1030,-90,610],[8.5,1070,15,540],[11.1,1075,8,540],[13.4,1340,130,400],[16,1340,130,400],[18.1,1110,-290,610],[21.5,1110,-290,610],[23.3,2060,-260,610]];
const chapters=[['hero',0,2.7,''],['care',2.7,7.3,'随手记录'],['residents',7.3,12.3,'认识居民'],['records',12.3,17.3,'回看日常'],['reminders',17.3,22,'任务提醒']];let hasFootage=false;
function pose(t){let i=0;while(i<poses.length-2&&t>poses[i+1][0])i++;const a=poses[i],b=poses[i+1],p=smooth((t-a[0])/(b[0]-a[0]));return a.slice(1).map((v,j)=>mix(v,b[j+1],p));}
function layout(t,stat=false){let active='hero';for(const el of copy)el.style.opacity='0';let label='';for(const[id,start,stop,text]of chapters)if(t>=start&&t<=stop){active=id;label=text;const opacity=Math.min(1,clamp((t-start)/.22),clamp((stop-t)/.22));const el=copy.find(e=>e.dataset.id===id);el.style.opacity=stat?'1':String(id==='hero'&&t<.25?1:opacity);}
 const[x,y,w]=pose(t);Object.assign(ui.style,{left:`${x}px`,top:`${y}px`,width:`${w}px`,height:`${w*2532/1170}px`});secondary.style.opacity=String(1-smooth((t-1.8)/1.3));secondary.style.transform=`translateX(${smooth((t-1.8)/1.3)*180}px)`;
 const graph=smooth((t-12.25)/.8)*(1-smooth((t-16.5)/.8));timeline.style.opacity=String(graph);timeline.style.transform=`translateX(${(1-graph)*65}px)`;chapter.textContent=label;chapter.style.top=active==='records'?'195px':'285px';chapter.style.opacity=label?copy.find(e=>e.dataset.id===active).style.opacity:'0';
 end.style.opacity=String(smooth((t-22)/.75));end.style.transform=`translateY(${(1-smooth((t-22)/.75))*12}px)`;document.querySelector('.brand').style.opacity=String(1-smooth((t-21.9)/1));document.querySelector('.progress i').style.width=`${clamp(t/24)*100}%`;
 const name=active==='residents'?'phone-residents':active==='records'?'phone-history':active==='reminders'?'phone-pause':'phone-home';shot.src=fallback.get(name).src;return active;
}
// # 展示背景与前景一起预加载，保证视频及海报没有缺失图层。
const garden=new Image();garden.src=base+'assets/presentation/water-garden.svg?v=1.6.10';document.querySelector('#stage').style.background=`#f5f3eb url("${garden.src}") center/cover no-repeat`;
window.ready=Promise.all([...document.images,...fallback.values(),garden].map(i=>i.decode())).then(()=>document.fonts.ready);
window.setFootage=async url=>{video.src=url;await new Promise((resolve,reject)=>{video.onloadeddata=resolve;video.onerror=reject;video.load()});hasFootage=true;};
window.frame=async t=>{layout(t);video.style.opacity=hasFootage&&t>=2?'1':'0';if(hasFootage&&t>=2){const target=Math.min(Math.max(0,t-2),video.duration-.04);if(Math.abs(video.currentTime-target)>.008){await new Promise(resolve=>{video.onseeked=resolve;video.currentTime=target;});await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));}}};
window.staticFrame=async id=>{const times={hero:.8,care:4.7,residents:9.7,records:14.7,reminders:19.7};hasFootage=false;video.style.opacity='0';layout(times[id]??.8,true);document.querySelector('.progress').style.display='none';await window.ready;};
await window.ready;await window.staticFrame(qs.get('scene')||'hero');
</script></html>
